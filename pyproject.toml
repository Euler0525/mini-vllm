[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-vllm"
version = "0.1.0"
description = "A minimal Qwen decoder inference runtime for systems learning"
requires-python = ">=3.12,<3.13"
dependencies = [
    "safetensors>=0.8.0",
    "torch>=2.13.0",
    "transformers>=5.15.0",
]

[project.optional-dependencies]
test = [
    "pytest>=9.1.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["mini_llm*", "mha_mqa_lab*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
